name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: build-htz-01
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release
        id: semantic
        uses: https://git.jdbnet.co.uk/jamie/go-semantic-release-provider-gitea@v1.2.3
        with:
          gitea-host: ${{ gitea.server_url }}
          gitea-token: ${{ secrets.GITEA_TOKEN }}

      - name: Checkout release tag
        if: steps.semantic.outputs.version != ''
        uses: actions/checkout@v4
        with:
          ref: v${{ steps.semantic.outputs.version }}
          fetch-depth: 0

      - name: Set up Go
        if: steps.semantic.outputs.version != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        if: steps.semantic.outputs.version != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build UI
        if: steps.semantic.outputs.version != ''
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
          npm run build

      - name: Build binaries
        if: steps.semantic.outputs.version != ''
        run: |
          go mod tidy
          VERSION="${{ steps.semantic.outputs.version }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o dockyard-amd64 ./cmd/dockyard
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o dockyard-arm64 ./cmd/dockyard

      - name: Build and push Docker image
        if: steps.semantic.outputs.version != ''
        run: |
          VERSION="${{ steps.semantic.outputs.version }}"
          IMAGE="cr.jdbnet.co.uk/public/dockyard"
          docker buildx create --name dockyard --use 2>/dev/null || docker buildx use dockyard
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            --push \
            .

      - name: Upload release assets
        if: steps.semantic.outputs.version != ''
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          tag_name: v${{ steps.semantic.outputs.version }}
          name: v${{ steps.semantic.outputs.version }}
          files: |
            dockyard-amd64
            dockyard-arm64

      - name: Upload to Cloudflare R2
        if: steps.semantic.outputs.version != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          aws s3 cp dockyard-amd64 s3://apps/dockyard-amd64 --endpoint-url "$R2_ENDPOINT"
          aws s3 cp dockyard-arm64 s3://apps/dockyard-arm64 --endpoint-url "$R2_ENDPOINT"
