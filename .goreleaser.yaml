version: 2

project_name: dockyard

before:
  hooks:
    - go mod tidy
    - bash -c 'cd ui && (npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund) && npm run build'

builds:
  - id: dockyard
    main: ./cmd/dockyard
    binary: dockyard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/jdbnet/dockyard/internal/version.Version={{.Version}}

archives:
  - id: binaries
    ids:
      - dockyard
    format: binary
    name_template: "dockyard-{{ .Arch }}"

nfpms:
  - id: dockyard
    package_name: dockyard
    ids:
      - dockyard
    vendor: JDB Net
    homepage: https://github.com/jdbnet/dockyard
    maintainer: Jamie <jamie@jdbnet.co.uk>
    description: |-
      Local-first Docker environment manager for Linux.
      Dockyard provides a k9s-style TUI and optional embedded Vue web UI
      for managing Docker containers and compose stacks.
    formats:
      - deb
    bindir: /usr/local/bin
    file_name_template: "dockyard_{{ .Version }}_{{ .Arch }}"
    contents:
      - src: deploy/dockyard.service
        dst: /lib/systemd/system/dockyard.service
      - src: config.yaml
        dst: /etc/dockyard/config.yaml
        type: config|noreplace
      - dst: /opt/stacks
        type: dir
        file_info:
          mode: 0755
    deb:
      compression: gzip

dockers:
  - id: linux-amd64
    ids:
      - dockyard
    dockerfile: Dockerfile.release
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/jdbnet/dockyard:{{ .Version }}-amd64"
    extra_files:
      - config.yaml
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/jdbnet/dockyard"
  - id: linux-arm64
    ids:
      - dockyard
    dockerfile: Dockerfile.release
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/jdbnet/dockyard:{{ .Version }}-arm64"
    extra_files:
      - config.yaml
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/jdbnet/dockyard"

docker_manifests:
  - name_templates:
      - "ghcr.io/jdbnet/dockyard:{{ .Version }}"
      - "ghcr.io/jdbnet/dockyard:latest"
    image_templates:
      - "ghcr.io/jdbnet/dockyard:{{ .Version }}-amd64"
      - "ghcr.io/jdbnet/dockyard:{{ .Version }}-arm64"

changelog:
  disable: true

release:
  github:
    owner: jdbnet
    name: dockyard
